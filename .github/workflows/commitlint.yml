name: Commitlint

on:
  pull_request:

permissions:
  contents: read

jobs:
  commitlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Lints only the commits in the PR range, using @commitlint/config-conventional.
      - uses: wagoid/commitlint-github-action@v6
